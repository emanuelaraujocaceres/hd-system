# ══════════════════════════════════════════════════════════════════════
# HD-System Supabase Configuration
# ══════════════════════════════════════════════════════════════════════
#
# Usage:
#   Development:  supabase start (local)
#   Staging:      supabase db push --linked (remote staging project)
#   Production:   supabase db push --linked (remote production project)
#
# To link a project:
#   supabase link --project-ref <project-id>
#
# ══════════════════════════════════════════════════════════════════════

[project_id]
# Staging project ID (create a separate Supabase project for staging)
# Example: tixwhmgzibvazkqbqoev (production)
# Staging: create a new project at https://app.supabase.com → New Project
# Then set the project ID here:
staging = "YOUR_STAGING_PROJECT_ID"
production = "tixwhmgzibvazkqbqoev"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[analytics]
enabled = false

[experimental]
# pg_ai not enabled
