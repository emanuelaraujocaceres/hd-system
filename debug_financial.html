<!DOCTYPE html>
<html>
<head><title>Debug Financial</title></head>
<body>
<h1>Debug Financial Accounts</h1>
<pre id="data" style="font-family: monospace; font-size: 12px;"></pre>
<script>
  const data = JSON.parse(localStorage.getItem('hd_system_financial_accounts') || '[]');
  const aluguel = data.filter(a => a.title === 'aluguel');
  let html = `Total contas: ${data.length}\n`;
  html += `Contas "aluguel": ${aluguel.length}\n\n`;
  aluguel.forEach((a, i) => {
    html += `--- Aluguel ${i+1} ---\n`;
    html += `ID: ${a.id}\n`;
    html += `isRecurring: ${a.isRecurring}\n`;
    html += `isInstallment: ${a.isInstallment}\n`;
    html += `recurrences: ${a.recurrences?.length || 0}\n`;
    html += `installments: ${a.installments?.length || 0}\n`;
    html += `status: ${a.status}\n\n`;
  });
  document.getElementById('data').textContent = html;
</script>
</body>
</html>
