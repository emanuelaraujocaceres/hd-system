<!DOCTYPE html>
<html>
<head><title>Debug Hydration</title></head>
<body>
<h1>Debug Hydration</h1>
<button onclick="testHydration()">Testar Hydration</button>
<pre id="output" style="font-family: monospace; font-size: 11px;"></pre>
<script>
  async function testHydration() {
    const output = document.getElementById('output');
    output.textContent = 'Testando...\n';
    
    try {
      // Importar storageService (simulado)
      const SUPABASE_URL = 'https://tixwhmgzibvazkqbqoev.supabase.co';
      const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpeHdobWd6aWJ2YXprcWJxb2V2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDg5NzI0MywiZXhwIjoyMTAwNDczMjQzfQ.j6FXodPl_xduyq_w_laaZEPE456hj_UxMcEqLevt2N0';
      
      // Buscar dados do Supabase
      const response = await fetch(`${SUPABASE_URL}/rest/v1/financial_transactions?store_branch_id=eq.e5085eba-4398-4c31-ae13-8082b46561ee&select=id,description,is_recurring,recurrence_count,recurrences_json`, {
        headers: { 'apikey': SERVICE_KEY, 'Authorization': `Bearer ${SERVICE_KEY}` }
      });
      const data = await response.json();
      
      output.textContent += `Dados do Supabase: ${data.length} registros\n\n`;
      
      // Testar safeParseJson
      data.forEach((r, i) => {
        output.textContent += `--- Registro ${i+1} ---\n`;
        output.textContent += `ID: ${r.id}\n`;
        output.textContent += `recurrences_json tipo: ${typeof r.recurrences_json}\n`;
        output.textContent += `recurrences_json é array: ${Array.isArray(r.recurrences_json)}\n`;
        if (typeof r.recurrences_json === 'string') {
          output.textContent += `Parseando string...\n`;
          const parsed = JSON.parse(r.recurrences_json);
          output.textContent += `Parseado: ${parsed.length} recorrências\n`;
        } else if (Array.isArray(r.recurrences_json)) {
          output.textContent += `Já é array: ${r.recurrences_json.length} recorrências\n`;
        }
        output.textContent += '\n';
      });
      
    } catch (e) {
      output.textContent += `Erro: ${e.message}\n${e.stack}`;
    }
  }
</script>
</body>
</html>
