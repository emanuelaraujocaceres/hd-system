<!DOCTYPE html>
<html>
<head><title>Criar Conta Recorrente</title></head>
<body>
<h1>Criando conta recorrente de teste...</h1>
<script>
  // Criar conta recorrente de teste
  const account = {
    id: 'fin-test-recurring-' + Date.now(),
    title: 'aluguel',
    type: 'payable',
    category: 'conta_pagar',
    amount: 1000,
    dueDate: '2026-08-08',
    status: 'pending',
    recipientOrPayer: 'Noel',
    storeBranchId: 'e5085eba-4398-4c31-ae13-8082b46561ee',
    organizationId: '361fb95a-3e9f-43be-a43c-0dc91f851f31',
    isRecurring: true,
    recurrenceType: 'monthly',
    recurrenceCount: 10,
    recurrences: []
  };
  
  // Criar 10 ocorrências
  for (let i = 0; i < 10; i++) {
    const d = new Date('2026-08-08');
    d.setMonth(d.getMonth() + i);
    account.recurrences.push({
      id: account.id + '-' + (i + 1),
      number: i + 1,
      dueDate: d.toISOString().slice(0, 10),
      status: 'pending'
    });
  }
  
  // Salvar no localStorage
  const key = 'hd_system_financial_accounts';
  const existing = JSON.parse(localStorage.getItem(key) || '[]');
  existing.unshift(account);
  localStorage.setItem(key, JSON.stringify(existing));
  
  alert('Conta recorrente criada! Voltando...');
  window.location.href = 'http://localhost:3000/';
</script>
</body>
</html>
