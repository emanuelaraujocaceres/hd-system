<!DOCTYPE html>
<html>
<head><title>Debug Completo</title></head>
<body>
<h1>Debug Financial Accounts</h1>
<h2>LocalStorage</h2>
<pre id="local" style="font-family: monospace; font-size: 11px; max-height: 300px; overflow: auto;"></pre>
<h2>Supabase</h2>
<pre id="supabase" style="font-family: monospace; font-size: 11px;">Carregando...</pre>
<script>
  // Mostrar localStorage
  const local = JSON.parse(localStorage.getItem('hd_system_financial_accounts') || '[]');
  const localSummary = local.map(a => ({
    id: a.id,
    title: a.title,
    isRecurring: a.isRecurring,
    isInstallment: a.isInstallment,
    recurrences: a.recurrences?.length || 0,
    installments: a.installments?.length || 0,
    first3Recurrences: a.recurrences?.slice(0, 3)
  }));
  document.getElementById('local').textContent = JSON.stringify(localSummary, null, 2);
  
  // Buscar do Supabase
  const SUPABASE_URL = 'https://tixwhmgzibvazkqbqoev.supabase.co';
  const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpeHdobWd6aWJ2YXprcWJxb2V2Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NDg5NzI0MywiZXhwIjoyMTAwNDczMjQzfQ.j6FXodPl_xduyq_w_laaZEPE456hj_UxMcEqLevt2N0';
  fetch(`${SUPABASE_URL}/rest/v1/financial_transactions?select=id,description,is_recurring,recurrence_count,recurrences_json&id=eq.547bb019-ffdf-4bc4-b775-bfbd0266b98d`, {
    headers: { 'apikey': SERVICE_KEY, 'Authorization': `Bearer ${SERVICE_KEY}` }
  })
  .then(r => r.json())
  .then(data => {
    document.getElementById('supabase').textContent = JSON.stringify(data, null, 2);
  })
  .catch(e => {
    document.getElementById('supabase').textContent = 'Erro: ' + e.message;
  });
</script>
</body>
</html>
